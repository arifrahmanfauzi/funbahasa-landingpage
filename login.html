<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Fun Bahasa #BahasaAdalahKita</title>
    <link rel="shortcut icon" href="img/funbahasa.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.1/dist/alpine.min.js" defer></script>
</head>
  <body>
    <section class="relative flex flex-wrap lg:h-screen lg:items-center">
      <div class="blue-div blue-div-2 flex items-center w-full sm:h-96 lg:h-full lg:w-1/2 bg-blue-600 ">
        <div class="container p-8 mx-auto overflow-hidden bg-blue-500 rounded-xl sm:p-9 xl:max-w-xl lg:max-w-md">
          <div>
            <h2 class="text-3xl font-semibold leading-tight tracking-normal text-white font-title sm:text-4xl lg:text-4xl xl:text-5xl">
              Platform bahasa dan sastra untuk mengembangkan literasi di <span class="text-yellow-200">Indonesia</span>
            </h2>
            <p class="text-xl text-white font-sans">
              #BahasaAdalahKita
            </p>
          </div>
        </div>
      </div>
      <div class="w-full px-6 py-12 sm:px-8 md:py-16 lg:w-1/2 lg:px-8 lg:py-0">
        <img src="img/funbahasa-logo.svg" alt="image funbahasa-logo" width="190px" height="63px" class="mx-auto">
          <div class="relative mx-auto max-w-lg text-center mt-6 sm:px-8 md:px-8 lg:px-6">
            <h1 class="text-gray-500 text-xl font-sans font-semibold sm:text-xl">Ayo Mulai 👋</h1>
            <p class="font-sans mt-1 text-gray-500">
              Hai, silahkan masuk untuk melanjutkan!
            </p>
          </div>
      
          <form action="" class="mx-auto mt-6 mb-0 max-w-md space-y-4 ">
            <div>
              <label for="email" class="sr-only block mb-2 text-sm font-medium text-gray-500 dark:text-white">alamat-email</label>
              <input type="email" name="email" id="user-email" class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" placeholder="email" required>
            </div>
            
            <div>
              <label for="password" class="sr-only block mb-2 text-sm font-medium text-gray-500 dark:text-white">kata-sandi</label>
              <input type="password" name="password" id="user-password" placeholder="kata sandi" class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" required>
            </div>

            <div class="flex justify-between">
              <div class="flex items-start mt-3">
                  <div class="flex items-center h-5">
                      <input id="remember" type="checkbox" name="persetujuan-pengguna" value="" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-2 focus:ring-blue-300 dark:bg-gray-600 dark:border-gray-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:focus:ring-offset-gray-800" required>
                  </div>
                  <label for="remember" class="font-sans ml-2 text-xs font-semibold text-gray-500 dark:text-gray-300">Ingat saya</label>
              </div>
              <a href="mailto:funbahasa@gmail.com?subject=Lupa%20kata%20sandi" class="mt-3 font-sans text-xs font-semibold text-blue-500 hover:underline">Lupa kata sandi?</a>
            </div>
            <button onclick="login()" type="button" class="w-full px-5 py-2 text-sm font-medium text-center text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300">Masuk</button>
            <div class="text-xs text-center font-sans font-semibold text-gray-500 lg:pb-4">
                Belum punya akun? <a href="register.html" class="text-blue-500 hover:underline">Silahkan daftar</a>
            </div>
          </form>
      </div>
    </section>
    <script>
      function login() {
        var email = document.getElementById("user-email").value.trim();
        var password = document.getElementById("user-password").value.trim();
        var checkbox = document.getElementById("remember").checked;

        if (email === "" || password === "") {
          alert("Harap isi semua field.");
          return;
        }
        if (!checkbox) {
          alert("Harap centang kotak persetujuan.");
          return;
        }
        window.location.href = "index-after-login.html";
      }
    </script>
